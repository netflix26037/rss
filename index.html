<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDDIT بالعربي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0e1113; color: #d7dadc; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        aside { width: 280px; background: #1a1a1b; border-left: 1px solid #343536; display: flex; flex-direction: column; padding: 20px; }
        h1 { font-size: 1.2rem; color: #ffffff; margin-bottom: 20px; text-align: center; }
        .nav-links { list-style: none; overflow-y: auto; flex: 1; }
        .nav-links li { padding: 10px 15px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; }
        .nav-links li:hover { background: #272729; }
        
        /* Main Content */
        main { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; }
        .feed-container { width: 100%; max-width: 700px; }
        
        /* Post Card */
        .post-card { background: #1a1a1b; border: 1px solid #343536; border-radius: 8px; margin-bottom: 16px; padding: 16px; transition: border-color 0.2s; }
        .post-card:hover { border-color: #818384; }
        .post-source { font-size: 0.8rem; color: #818384; margin-bottom: 6px; font-weight: bold; }
        .post-title { font-size: 1.1rem; color: #ffffff; text-decoration: none; display: block; margin-bottom: 10px; line-height: 1.4; }
        .post-title:hover { color: #d7dadc; text-decoration: underline; }
        .post-desc { font-size: 0.9rem; color: #818384; margin-bottom: 12px; }
        
        /* Media Support (Images & Videos) */
        .post-media { width: 100%; max-height: 450px; object-fit: cover; border-radius: 6px; margin-top: 10px; background: #000; }
        .post-video { width: 100%; max-height: 450px; border-radius: 6px; margin-top: 10px; }
        
        .loading { text-align: center; color: #818384; margin-top: 50px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <aside>
        <h1>REDDIT بالعربي</h1>
        <ul id="sources-list" class="nav-links">
            <li onclick="filterSource('all')">🔥 جميع المنشورات</li>
        </ul>
    </aside>

    <main>
        <div id="loading" class="loading">جاري جلب أحدث الخلاصات مباشرة...</div>
        <div id="feed" class="feed-container"></div>
    </main>

    <script>
        const WORKER_PROXY = 'https://rss-proxy.red-108.workers.dev/?url=';
        let allArticles = [];
        let currentSource = 'all';

        async function init() {
            try {
                const res = await fetch('feed.json');
                const sources = await res.json();
                
                renderSourcesMenu(sources);
                
                // جلب البيانات من كل المصادر متوازية ومتجاوزة للحظر
                const promises = sources.map(source => fetchFeedData(source));
                const results = await Promise.all(promises);
                
                allArticles = results.flat();
                allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                document.getElementById('loading').style.display = 'none';
                renderArticles(allArticles);

            } catch (err) {
                console.error("خطأ في التحميل:", err);
                document.getElementById('loading').innerText = 'فشل تحميل الخلاصات، تحقق من الاتصال.';
            }
        }

        async function fetchFeedData(source) {
            try {
                let targetUrl = source.url;
                if (targetUrl.includes('reddit.com') && !targetUrl.endsWith('.rss')) {
                    targetUrl = targetUrl.replace(/\/$/, '') + '/.rss';
                }

                const res = await fetch(WORKER_PROXY + encodeURIComponent(targetUrl));
                const text = await res.text();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = Array.from(xml.querySelectorAll('item, entry'));

                return items.map(item => {
                    const contentHtml = item.querySelector('description, content, summary')?.textContent || '';
                    return {
                        id: item.querySelector('guid, id, link')?.textContent || Math.random(),
                        title: item.querySelector('title')?.textContent || 'بدون عنوان',
                        link: item.querySelector('link')?.textContent || item.querySelector('link')?.getAttribute('href') || '#',
                        pubDate: item.querySelector('pubDate, updated, published')?.textContent || new Date().toISOString(),
                        description: contentHtml.replace(/<[^>]*>?/gm, '').substring(0, 150) + '...',
                        sourceName: source.name,
                        mediaImage: extractImage(item, contentHtml),
                        mediaVideo: extractVideo(contentHtml)
                    };
                });
            } catch (e) {
                console.warn(`فشل جلب المصدر: ${source.name}`);
                return [];
            }
        }

        function extractImage(item, html) {
            // استخراج الصور بدقة دون التأثير على التنسيق
            const mediaTag = item.getElementsByTagNameNS('*', 'content')[0] || item.querySelector('enclosure');
            if (mediaTag && mediaTag.getAttribute('url')) return mediaTag.getAttribute('url');
            
            const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (match && !match[1].includes('award_images')) return match[1];
            return null;
        }

        function extractVideo(html) {
            const match = html.match(/<video[^>]*>.*?<\/video>|<iframe[^>]*src=["']([^"']+)["'][^>]*>.*?<\/iframe>/i);
            return match ? match[0] : null;
        }

        function renderSourcesMenu(sources) {
            const list = document.getElementById('sources-list');
            sources.forEach(src => {
                const li = document.createElement('li');
                li.innerText = src.name;
                li.onclick = () => filterSource(src.name);
                list.appendChild(li);
            });
        }

        function filterSource(sourceName) {
            currentSource = sourceName;
            if (sourceName === 'all') {
                renderArticles(allArticles);
            } else {
                const filtered = allArticles.filter(a => a.sourceName === sourceName);
                renderArticles(filtered);
            }
        }

        function renderArticles(articles) {
            const container = document.getElementById('feed');
            if (articles.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#818384;">لا توجد مقالات متاحة حالياً.</p>';
                return;
            }

            container.innerHTML = articles.map(art => `
                <div class="post-card">
                    <div class="post-source">${art.sourceName}</div>
                    <a href="${art.link}" target="_blank" class="post-title">${art.title}</a>
                    <div class="post-desc">${art.description}</div>
                    ${art.mediaImage ? `<img src="${art.mediaImage}" class="post-media" loading="lazy" />` : ''}
                    ${art.mediaVideo ? `<div class="post-video">${art.mediaVideo}</div>` : ''}
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
