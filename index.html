/* شعار Reddit (Snoo) — دائرة برتقالية مع أذنَي الروبوت المميزتين */

<script>
let sources = [];
let allFetchedArticles = [];
let currentTab = 'unread';
let selectedCategory = 'الكل';
let readIds = new Set(JSON.parse(localStorage.getItem('app_read_ids') || '[]'));
let favoriteArticles = JSON.parse(localStorage.getItem('app_favorite_articles') || '[]');
let observer = null;
const translationCache = new Map();
const translationQueue = [];
let isTranslating = false;

// عرض مقسّم على دفعات: يقلل عدد العناصر التي تحتاج ترجمة فورية عند كل تبديل
const PAGE_SIZE = 8;
let renderedCount = 0;
let activeList = [];

function toggleSidebar() {
  const drawer = document.getElementById('sidebar-drawer');
  drawer.classList.toggle('hidden');
  drawer.classList.toggle('flex');
}

function cleanText(raw) {
  if (!raw) return '';
  let txt = document.createElement("textarea");
  txt.innerHTML = raw;
  let decoded = txt.value;
  return decoded.replace(/<[^>]*>?/gm, '').replace(/\s+/g, ' ').trim();
}

function queueTranslation(text, elementId) {
  if (!text || text.trim() === '') return;
  if (translationCache.has(text)) {
    const el = document.getElementById(elementId);
    if (el) {
      el.innerText = translationCache.get(text);
      el.classList.remove('opacity-70', 'animate-pulse-soft');
    }
    return;
  }
  translationQueue.push({ text, elementId });
  processTranslationQueue();
}

async function processTranslationQueue() {
  if (isTranslating || translationQueue.length === 0) return;
  isTranslating = true;
  const { text, elementId } = translationQueue.shift();
  const el = document.getElementById(elementId);
  try {
    const queryText = text.substring(0, 300);
    const translated = await translateClientSide(queryText);
    if (translated) {
      translationCache.set(text, translated);
      if (el) el.innerText = translated;
    } else {
      console.warn('تعذّرت ترجمة النص من كل المزوّدين:', queryText.substring(0, 40));
    }
  } catch (error) {
    console.warn('خطأ أثناء الترجمة:', error);
  } finally {
    if (el) el.classList.remove('opacity-70', 'animate-pulse-soft');
    setTimeout(() => {
      isTranslating = false;
      processTranslationQueue();
    }, 200);
  }
}

// الموقع مستضاف على GitHub Pages (ثابت 100%، بدون خادم/Serverless Functions)،
// لذلك نستدعي الترجمة مباشرة من المتصفح عبر مزوّدين يدعمان CORS فعلياً.
const LINGVA_MIRRORS = [
  'https://lingva.ml',
  'https://lingva.garudalinux.org',
  'https://translate.plausibility.cloud'
];

// كشف تلقائي مبسّط للغة المصدر (يابانية/صينية/إنجليزية) — بعض المصادر مثل
// CRYPTO TIMES يابانية وBlockTempo صينية، وMyMemory تحتاج رمز اللغة الصحيح
function detectSourceLang(text) {
  if (/[\u3040-\u30ff]/.test(text)) return 'ja'; // هيراغانا/كاتاكانا = يابانية
  if (/[\u4e00-\u9fff]/.test(text)) return 'zh-CN'; // رموز صينية (بدون هيراغانا)
  return 'en';
}

async function translateClientSide(text) {
  const sourceLang = detectSourceLang(text);

  // المحاولة 1: MyMemory — مصمّمة أصلاً لطلبات المتصفح المباشرة (CORS مفعّل)
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|ar`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      const translated = data?.responseData?.translatedText;
      if (translated && !translated.toUpperCase().includes('MYMEMORY WARNING')) {
        return translated;
      }
    }
  } catch (e) {
    console.warn('فشل MyMemory:', e.message);
  }

  // المحاولة 2: Lingva (عدة مرايا احتياطية)
  for (const base of LINGVA_MIRRORS) {
    try {
      const url = `${base}/api/v1/${sourceLang}/ar/${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data && data.translation) return data.translation;
      }
    } catch (e) {
      console.warn(`فشل Lingva (${base}):`, e.message);
    }
  }

  return null;
}

async function fetchPrices() {
  try {
    const btcRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
    const btcData = await btcRes.json();
    if (btcData.bitcoin) {
      document.getElementById('price-BTC').innerText = '$' + btcData.bitcoin.usd.toLocaleString();
    }
  } catch (e) {}
  try {
    const brentRes = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/BZ=F');
    const brentData = await brentRes.json();
    const price = brentData.chart.result[0].meta.regularMarketPrice;
    if (price) {
      document.getElementById('price-BRENT').innerText = '$' + price.toFixed(2);
    }
  } catch (e) {}
}

async function fetchDirectData() {
  const paths = ['feed.json', './feed.json', '/feed.json'];
  for (let path of paths) {
    try {
      const response = await fetch(`${path}?nocache=${Date.now()}`);
      if (response.ok) {
        const data = await response.json();
        let rawArticles = [];
        if (Array.isArray(data)) rawArticles = data;
        else if (data.articles && Array.isArray(data.articles)) rawArticles = data.articles;
        else if (data.items && Array.isArray(data.items)) rawArticles = data.items;
        if (rawArticles.length > 0) {
          return rawArticles.map((art, idx) => ({
            id: art.id || art.link || art.guid || `art-${idx}-${Date.now()}`,
            arabicTitle: art.arabicTitle || '',
            title: art.title || art.originalTitle || '',
            arabicDescription: art.arabicDescription || '',
            description: art.description || art.originalDescription || '',
            link: art.link || '#',
            sourceName: art.sourceName || 'Reddit',
            category: art.category || 'عام',
            pubDate: art.pubDate || new Date().toISOString(),
            media: art.media || { image: art.image || null }
          }));
        }
      }
    } catch (e) {}
  }
  return [];
}

async function fetchSourcesJSON() {
  try {
    const response = await fetch(`./sources.json?nocache=${Date.now()}`);
    if (response.ok) return await response.json();
  } catch(e) {}
  return [];
}

function timeAgo(dateString) {
  const date = new Date(dateString);
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);
  if (isNaN(seconds)) return 'الآن';
  let interval = Math.floor(seconds / 3600);
  if (interval >= 1) return `منذ ${interval} س`;
  interval = Math.floor(seconds / 60);
  if (interval >= 1) return `منذ ${interval} د`;
  return `الآن`;
}

// ===== التصنيفات: عرضها كشرائح أفقية بدل تحميل كل شيء دفعة واحدة =====
function getAllCategories() {
  const set = new Set();
  sources.forEach(s => set.add(s.category || 'عام'));
  allFetchedArticles.forEach(a => set.add(a.category || 'عام'));
  return ['الكل', ...Array.from(set)];
}

// عدد المقالات غير المقروءة لكل تصنيف (يُستخدم كعداد بجانب اسم التصنيف)
function getUnreadCountForCategory(cat) {
  const unread = allFetchedArticles.filter(a => !readIds.has(a.id));
  if (cat === 'الكل') return unread.length;
  return unread.filter(a => (a.category || 'عام') === cat).length;
}

function renderCategoryChips() {
  const container = document.getElementById('category-chips');
  const cats = getAllCategories();
  container.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    const isActive = cat === selectedCategory;
    const count = getUnreadCountForCategory(cat);
    btn.className = `chip ${isActive ? 'active' : 'bg-reddit-card text-gray-300 border border-reddit-border'} text-[11px] font-bold px-3 py-1.5 rounded-full shrink-0 inline-flex items-center gap-1.5`;
    const countClass = isActive
      ? 'bg-black/20 text-white'
      : 'bg-reddit-orange/15 text-reddit-orange';
    btn.innerHTML = `
      <span>${cat}</span>
      <span class="${countClass} text-[10px] font-bold px-1.5 rounded-full min-w-[16px] leading-[16px] text-center mono">${count}</span>
    `;
    btn.onclick = () => selectCategory(cat);
    container.appendChild(btn);
  });
}

function selectCategory(cat) {
  selectedCategory = cat;
  renderCategoryChips();
  renderCurrentTab();
}

function renderSources() {
  const container = document.getElementById('sources-container');
  container.innerHTML = '';
  if (!sources || sources.length === 0) {
    container.innerHTML = `<div class="text-center py-4 text-xs text-gray-400">جميع المصادر متاحة في القائمة الرئيسية</div>`;
    return;
  }
  const grouped = {};
  sources.forEach((s, idx) => {
    const cat = s.category || 'عام';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push({ ...s, idx });
  });
  for (const [cat, items] of Object.entries(grouped)) {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'space-y-1 bg-black/30 p-2.5 rounded-xl border border-reddit-border';
    groupDiv.innerHTML = `
      <div class="flex items-center justify-between pb-1 border-b border-reddit-border">
        <button onclick="filterCategoryFromDrawer('${cat.replace(/'/g, "\\'")}')" class="text-xs font-bold text-reddit-orange flex items-center gap-1">
          <i class="fa-solid fa-folder-open"></i> ${cat}
        </button>
        <span class="text-[10px] text-gray-500 mono">${items.length}</span>
      </div>
      <ul class="space-y-1 pt-1.5"></ul>
    `;
    const ul = groupDiv.querySelector('ul');
    items.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-reddit-card text-xs">
          <button onclick="filterBySource('${item.name.replace(/'/g, "\\'")}')" class="text-right flex-grow truncate">
            ${item.name}
          </button>
        </div>
      `;
      ul.appendChild(li);
    });
    container.appendChild(groupDiv);
  }
}

function filterCategoryFromDrawer(cat) {
  toggleSidebar();
  selectCategory(cat);
}

function filterBySource(sourceName) {
  toggleSidebar();
  document.getElementById('current-feed-title').innerHTML = `<i class="fa-solid fa-fire text-reddit-orange"></i> ${sourceName}`;
  const filtered = allFetchedArticles.filter(a => a.sourceName === sourceName);
  renderArticlesContainer(filtered, false);
}

function markAsReadHover(id) {
  if (!readIds.has(id)) {
    readIds.add(id);
    localStorage.setItem('app_read_ids', JSON.stringify([...readIds]));
    updateCounts();
  }
}

function toggleFavoriteArticle(articleId, event) {
  if(event) event.stopPropagation();
  const targetArticle = allFetchedArticles.find(a => a.id === articleId) || favoriteArticles.find(a => a.id === articleId);
  if (!targetArticle) return;
  const index = favoriteArticles.findIndex(a => a.id === articleId);
  if (index > -1) {
    favoriteArticles.splice(index, 1);
  } else {
    favoriteArticles.push(targetArticle);
  }
  localStorage.setItem('app_favorite_articles', JSON.stringify(favoriteArticles));
  updateCounts();
  renderCurrentTab();
}

function updateCounts() {
  const unreadList = allFetchedArticles.filter(a => !readIds.has(a.id));
  const readList = allFetchedArticles.filter(a => readIds.has(a.id));
  document.getElementById('count-unread').innerText = unreadList.length;
  document.getElementById('count-favorites').innerText = favoriteArticles.length;
  document.getElementById('count-read').innerText = readList.length;
  renderCategoryChips();
}

function switchTab(tab) {
  currentTab = tab;
  ['unread', 'favorites', 'read'].forEach(t => {
    const btn = document.getElementById(`tab-${t}`);
    if (t === tab) {
      btn.className = "flex flex-col items-center gap-1 text-reddit-orange transition active:scale-95";
    } else {
      btn.className = "flex flex-col items-center gap-1 text-gray-400 transition active:scale-95";
    }
  });
  renderCurrentTab();
}

function renderCurrentTab() {
  updateCounts();
  let displayList = [];
  if (currentTab === 'unread') {
    displayList = allFetchedArticles.filter(a => !readIds.has(a.id));
  } else if (currentTab === 'read') {
    displayList = allFetchedArticles.filter(a => readIds.has(a.id));
  } else if (currentTab === 'favorites') {
    displayList = favoriteArticles;
  }
  if (selectedCategory && selectedCategory !== 'الكل') {
    displayList = displayList.filter(a => (a.category || 'عام') === selectedCategory);
  }

  const titleLabel = selectedCategory === 'الكل' ? 'التحديثات الأخيرة' : selectedCategory;
  document.getElementById('current-feed-title').innerHTML = `<i class="fa-solid fa-fire text-reddit-orange"></i> ${titleLabel}`;

  renderArticlesContainer(displayList, false);
}

// عرض تدريجي (Pagination) — لا تُترجم إلا العناصر المعروضة فعليًا، وهذا يقلّل
// الضغط على خدمة الترجمة وعلى حجم البيانات المطلوب جلبها في كل مرة
function renderArticlesContainer(fullList, append) {
  const container = document.getElementById('articles-container');
  const loadMoreBtn = document.getElementById('load-more-btn');

  if (!append) {
    activeList = fullList || [];
    renderedCount = 0;
    container.innerHTML = '';
    translationQueue.length = 0;
    isTranslating = false;
    if (observer) observer.disconnect();
  }

  document.getElementById('results-count').innerText = activeList.length ? `${activeList.length} منشور` : '';

  if (!activeList || activeList.length === 0) {
    container.innerHTML = `<div class="text-center py-16 text-gray-500 bg-reddit-card rounded-xl border border-reddit-border text-xs">لا توجد مواضيع في هذا القسم حالياً.</div>`;
    loadMoreBtn.classList.add('hidden');
    return;
  }

  if (!observer) {
    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const artId = entry.target.getAttribute('data-id');
          if (artId) {
            markAsReadHover(artId);
            observer.unobserve(entry.target);
          }
        }
      });
    }, { threshold: 0.5 });
  }

  const nextSlice = activeList.slice(renderedCount, renderedCount + PAGE_SIZE);

  nextSlice.forEach((item, sliceIdx) => {
    const globalIdx = renderedCount + sliceIdx;
    const isFav = favoriteArticles.some(a => a.id === item.id);
    const agoText = timeAgo(item.pubDate);
    const hasArabicTitle = Boolean(item.arabicTitle && item.arabicTitle.trim());
    const hasArabicDesc = Boolean(item.arabicDescription && item.arabicDescription.trim());
    const initialTitle = cleanText(hasArabicTitle ? item.arabicTitle : item.title);
    const initialDesc = cleanText(hasArabicDesc ? item.arabicDescription : item.description);
    const titleLoadingClass = !hasArabicTitle ? 'opacity-70 animate-pulse-soft' : '';
    const descLoadingClass = !hasArabicDesc ? 'opacity-70 animate-pulse-soft' : '';

    let mediaHTML = '';
    if (item.media && item.media.image) {
      mediaHTML = `
        <div class="my-2 overflow-hidden rounded-lg bg-gray-100 border border-gray-200">
          <img src="${item.media.image}" alt="Media" class="w-full max-h-[250px] object-cover" loading="lazy" onerror="this.style.display='none'">
        </div>`;
    }

    const titleId = `title-${globalIdx}`;
    const descId = `desc-${globalIdx}`;

    // تناوب خلفية المقالات: أبيض / رمادي فاتح جداً، على طراز Reddit القديم
    const isAlt = globalIdx % 2 === 1;
    const cardBg = isAlt ? 'bg-gray-50' : 'bg-white';
    const cardBorder = 'border-gray-200';
    const titleColor = 'text-gray-900';
    const descColor = 'text-gray-600';
    const metaColor = 'text-gray-500';

    const card = document.createElement('article');
    card.setAttribute('data-id', item.id);
    card.className = `w-full ${cardBg} border ${cardBorder} p-4 rounded-xl flex flex-col justify-between relative hover:border-gray-300 transition shadow-sm`;
    card.innerHTML = `
      <div>
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1.5">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-reddit-orange/10 text-reddit-orange border border-reddit-orange/25">
              <i class="fa-brands fa-reddit-alien"></i> ${item.sourceName || 'Reddit'}
            </span>
            <span class="text-[9px] mono ${metaColor}">${item.category || 'عام'}</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-[10px] mono ${metaColor}">
              <i class="fa-regular fa-clock"></i> ${agoText}
            </span>
            <button onclick="toggleFavoriteArticle('${item.id.replace(/'/g, "\\'")}', event)" class="text-lg p-1 active:scale-125 transition ${isFav ? 'upvoted' : 'text-gray-400'}">
              <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-star"></i>
            </button>
          </div>
        </div>
        <h3 id="${titleId}" class="font-bold text-sm leading-snug mb-1.5 ${titleColor} ${titleLoadingClass}">${initialTitle}</h3>
        ${mediaHTML}
        <p id="${descId}" class="${descColor} text-xs line-clamp-3 mb-3 leading-relaxed ${descLoadingClass}">${initialDesc}</p>
      </div>
      <div class="flex items-center justify-between pt-2 border-t ${cardBorder} mt-1">
        <a href="${item.link}" target="_blank" class="bg-reddit-orange text-white px-3 py-1.5 rounded-full text-[11px] font-bold flex items-center gap-1.5 transition active:scale-95 hover:bg-reddit-orangeDark">
          زيارة المصدر <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
        </a>
      </div>
    `;
    container.appendChild(card);

    if (currentTab === 'unread') {
      observer.observe(card);
    }

    if (!hasArabicTitle && initialTitle) {
      queueTranslation(initialTitle, titleId);
    }
    if (!hasArabicDesc && initialDesc) {
      queueTranslation(initialDesc, descId);
    }
  });

  renderedCount += nextSlice.length;

  if (renderedCount < activeList.length) {
    loadMoreBtn.classList.remove('hidden');
  } else {
    loadMoreBtn.classList.add('hidden');
  }
}

function loadMore() {
  renderArticlesContainer(activeList, true);
}

function startClock() {
  setInterval(() => {
    const el = document.getElementById('digital-clock');
    if (el) el.innerText = new Date().toTimeString().split(' ')[0];
  }, 1000);
}

window.onload = async function() {
  startClock();
  fetchPrices();
  setInterval(fetchPrices, 60000);
  sources = await fetchSourcesJSON();
  renderSources();
  renderCategoryChips();
  allFetchedArticles = await fetchDirectData();
  renderCategoryChips();
  renderCurrentTab();
};
</script>
</body>
