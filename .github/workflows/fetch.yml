name: Update News Feed

on:
  schedule:
    # تشغيل تلقائي كل 15 دقيقة
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install rss-parser axios node-fetch

      - name: Run Fetch Script
        run: |
          node fetch-feeds.js

      - name: Commit and Push Updated Feed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add feed.json articles.json sources.json || true
          git commit -m "Auto-update feed.json [skip ci]" || echo "No changes to commit"
          git push
