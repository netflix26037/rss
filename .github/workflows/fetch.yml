name: Update RSS Feeds

on:
  schedule:
    - cron: '0 * * * *' # يتم التحديث تلقائياً كل ساعة
  workflow_dispatch: # يتيح لك إمكانية التشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install rss-parser axios

      - name: Run Fetch Script
        run: node fetch-feeds.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update articles.json [skip ci]" && git push)
