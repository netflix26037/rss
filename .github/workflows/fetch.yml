name: Update News Feed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-news-feed
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install rss-parser axios

      - name: Run Fetch Script
        run: |
          node fetch-feeds.js

      - name: Commit and Push Updated Feed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # نثبّت (commit) التغييرات أولاً حتى تصبح شجرة العمل نظيفة قبل أي محاولة سحب/rebase.
          # هذا يمنع خطأ "cannot pull with rebase: You have unstaged changes".
          git add feed.json sources.json || true
          git commit -m "Auto-update feed.json [skip ci]" || echo "لا توجد تغييرات لعمل commit"

          # محاولات متكررة للدفع في حال تعارضه مع تشغيل آخر متزامن (جدولة + push تتزامنان أحياناً)
          push_ok=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              push_ok=true
              break
            fi

            echo "فشل الدفع (محاولة $i) — سيتم سحب آخر التحديثات وإعادة الترتيب..."
            git fetch origin main

            # نفضّل نسختنا من feed.json/sources.json عند أي تعارض لأنها الأحدث المُولّدة للتو
            if ! git rebase origin/main -X ours; then
              echo "تعارض أثناء rebase — سيتم إلغاؤه واعتماد أحدث نسخة من الفرع البعيد كأساس"
              git rebase --abort || true
              git reset --hard origin/main
              git add feed.json sources.json || true
              git commit -m "Auto-update feed.json [skip ci]" || echo "لا توجد تغييرات لعمل commit"
            fi

            sleep $((RANDOM % 8 + 4))
          done

          if [ "$push_ok" = false ]; then
            echo "فشل الدفع بعد عدة محاولات"
            exit 1
          fi
