name: Update News Feed

on:
  schedule:
    # تشغيل تلقائي كل 15 دقيقة
    - cron: '*/15 * * * *'
  workflow_dispatch: # تسمح بالتجديد اليدوي من زر Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Script
        run: |
          # قم بتعديل هذا السطر باسم السكريبت الخاص بك (مثلاً: python generate_feed.py)
          python main.py

      - name: Commit and Push Updated Feed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add feed.json sources.json || true
          git commit -m "Auto-update feed.json [skip ci]" || echo "No changes to commit"
          git push
