name: Auto Fetch RSS Feeds

on:
  schedule:
    # يعمل تلقائياً كل ساعة (0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً من GitHub في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch Latest Feeds
        run: node fetch-feeds.js

      - name: Commit and Push Updated Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "Auto-update articles.json [skip ci]" || exit 0
          git push
