<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDDIT بالعربي</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f1419;
            color: #e7e9ea;
            padding: 12px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #2f3336;
            margin-bottom: 15px;
        }

        header h1 {
            color: #ff4500;
            font-size: 1.5rem;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .feed-item {
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 12px;
            padding: 14px;
        }

        .feed-item a {
            text-decoration: none;
            color: #e7e9ea;
        }

        .feed-item h3 {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #f7f9f9;
        }

        .feed-item h3:hover {
            color: #ff4500;
        }

        .feed-item p {
            color: #71767b;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 10px;
            word-break: break-word;
        }

        /* تنسيق الوسائط لتعمل بشكل مثالي على الآيفون */
        .feed-media {
            margin-top: 10px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feed-media img, 
        .feed-media video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 10px;
        }

        .feed-media iframe {
            width: 100%;
            height: 280px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>REDDIT بالعربي</h1>
        </header>

        <main id="feed-container" class="feed-container">
            <p style="text-align: center; color: #71767b; font-size: 0.9rem;">جاري جلب الخلاصات...</p>
        </main>
    </div>

    <script>
        // دالة فك ترميز HTML المعالج من Reddit[cite: 5]
        function decodeHTML(html) {
            if (!html) return '';
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        // استخراج وسائط Reddit (صور، فيديوهات، GIFs)[cite: 5]
        function extractRedditMedia(item) {
            const rawContent = decodeHTML(item.content || item.description || item['content:encoded'] || '');[cite: 5]
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawContent;[cite: 5]

            // 1. البحث عن روابط الفيديوهات المضمنة (YouTube, Embeds, Iframe)[cite: 5]
            const iframe = tempDiv.querySelector('iframe');[cite: 5]
            if (iframe && iframe.src) {
                return `<iframe src="${iframe.src}" allowfullscreen></iframe>`;[cite: 5]
            }

            // 2. البحث عن الوسوم المباشرة للفيديو[cite: 5]
            const video = tempDiv.querySelector('video');[cite: 5]
            if (video) {
                const videoSrc = video.querySelector('source')?.src || video.src;
                if (videoSrc) {
                    return `<video controls playsinline preload="metadata"><source src="${videoSrc}"></video>`;
                }
            }

            // 3. البحث عن روابط الصور المباشرة (i.redd.it / i.imgur.com) داخل الروابط والنصوص[cite: 5]
            const mediaLink = tempDiv.querySelector('a[href*="i.redd.it"], a[href*="i.imgur.com"], a[href*="preview.redd.it"]');
            if (mediaLink && mediaLink.href) {
                let imgUrl = mediaLink.href.replace(/&amp;/g, '&');
                if (imgUrl.match(/\.(jpeg|jpg|gif|png|webp)/i) || imgUrl.includes('i.redd.it')) {
                    return `<img src="${imgUrl}" alt="Reddit Media" loading="lazy" onerror="this.parentElement.style.display='none'">`;
                }
            }

            // 4. استخراج الصورة المباشرة من وسم <img> داخل النص[cite: 5]
            const img = tempDiv.querySelector('img');[cite: 5]
            if (img && img.src) {
                let src = img.src.replace(/&amp;/g, '&');[cite: 5]
                // تجاهل أيقونات الجوائز والرموز التعبيرية الصغرى
                if (!src.includes('award_images') && !src.includes('emoji')) {
                    return `<img src="${src}" alt="Reddit Media" loading="lazy" onerror="this.parentElement.style.display='none'">`;
                }
            }

            // 5. استخدام الصورة المصغرة كخيار أخير إذا كانت بدقة مناسبة[cite: 5]
            if (item.thumbnail && item.thumbnail.startsWith('http') && !item.thumbnail.includes('default') && !item.thumbnail.includes('self')) {[cite: 5]
                let thumb = item.thumbnail.replace(/&amp;/g, '&');
                return `<img src="${thumb}" alt="Reddit Media" loading="lazy" onerror="this.parentElement.style.display='none'">`;
            }

            return null;[cite: 5]
        }

        // دالة بناء وتنسيق منشور Reddit[cite: 5]
        function renderFeedItem(item) {
            const itemCard = document.createElement('article');[cite: 5]
            itemCard.className = 'feed-item';[cite: 5]

            // تنظيف النص وإزالة أوسمة HTML والميديا لعرض النص الصافي فقط[cite: 5]
            const rawContent = decodeHTML(item.content || item.description || '');[cite: 5]
            const tempDiv = document.createElement('div');[cite: 5]
            tempDiv.innerHTML = rawContent;[cite: 5]
            const cleanText = tempDiv.textContent || tempDiv.innerText || '';[cite: 5]
            
            const mediaContent = extractRedditMedia(item);[cite: 5]

            itemCard.innerHTML = `
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">
                    <h3>${item.title}</h3>
                </a>
                ${cleanText.trim() ? `<p>${cleanText.substring(0, 180)}...</p>` : ''}
                ${mediaContent ? `<div class="feed-media">${mediaContent}</div>` : ''}
            `;[cite: 5]

            return itemCard;[cite: 5]
        }

        // دالة جلب الخلاصات وتعبئتها[cite: 5]
        async function fetchFeeds() {
            const container = document.getElementById('feed-container');[cite: 5]
            
            try {
                // ضع رابط خلاصة Reddit المطلوب هنا عبر خدمة rss2json
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://www.reddit.com/r/arabic/.rss'));
                const data = await response.json();
                
                if (data.status === 'ok' && data.items.length > 0) {
                    container.innerHTML = '';
                    data.items.forEach(item => {
                        container.appendChild(renderFeedItem(item));
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #71767b;">لا توجد مواضيع متاحة حالياً.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p style="text-align: center; color: #ef4444;">حدث خطأ أثناء تحميل الخلاصات.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchFeeds);[cite: 5]
    </script>
</body>
</html>
