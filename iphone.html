<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDDIT بالعربي</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f1419;
            color: #e7e9ea;
            padding: 12px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #2f3336;
            margin-bottom: 15px;
        }

        header h1 {
            color: #ff4500;
            font-size: 1.5rem;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .feed-item {
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 12px;
            padding: 14px;
        }

        .feed-item a {
            text-decoration: none;
            color: #e7e9ea;
        }

        .feed-item h3 {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #f7f9f9;
        }

        .feed-item p {
            color: #71767b;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .feed-media {
            margin-top: 10px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feed-media img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>REDDIT بالعربي</h1>
        </header>

        <main id="feed-container" class="feed-container">
            <p style="text-align: center; color: #71767b; font-size: 0.9rem;">جاري جلب الخلاصات...</p>
        </main>
    </div>

    <script>
        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        function extractRedditMedia(item) {
            const rawContent = decodeHTML(item.content || item.description || '');
            const doc = new DOMParser().parseFromString(rawContent, 'text/html');

            const imgTag = doc.querySelector('img');
            if (imgTag && imgTag.src) {
                let src = imgTag.src.replace(/&amp;/g, '&');
                if (!src.includes('award_images') && !src.includes('external-preview')) {
                    return `<img src="${src}" alt="Reddit Media" loading="lazy" onerror="this.parentElement.style.display='none'">`;
                }
            }

            const aTag = doc.querySelector('a[href*="i.redd.it"], a[href*="v.redd.it"], a[href*="i.imgur.com"]');
            if (aTag && aTag.href) {
                if (aTag.href.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
                    return `<img src="${aTag.href}" alt="Reddit Media" loading="lazy" onerror="this.parentElement.style.display='none'">`;
                }
            }

            if (item.thumbnail && item.thumbnail.startsWith('http') && !item.thumbnail.includes('default') && !item.thumbnail.includes('self')) {
                let thumb = item.thumbnail.replace(/&amp;/g, '&');
                return `<img src="${thumb}" alt="Reddit Media" loading="lazy" onerror="this.parentElement.style.display='none'">`;
            }

            return null;
        }

        function renderFeedItem(item) {
            const itemCard = document.createElement('article');
            itemCard.className = 'feed-item';

            const rawContent = decodeHTML(item.content || item.description || '');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawContent;
            const cleanText = tempDiv.textContent || tempDiv.innerText || '';

            const mediaContent = extractRedditMedia(item);

            itemCard.innerHTML = `
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">
                    <h3>${item.title}</h3>
                </a>
                ${cleanText.trim() ? `<p>${cleanText.substring(0, 150)}...</p>` : ''}
                ${mediaContent ? `<div class="feed-media">${mediaContent}</div>` : ''}
            `;

            return itemCard;
        }

        async function fetchFeeds() {
            const container = document.getElementById('feed-container');
            
            try {
                // استبدل الرابط أدناه برابط الخلاصة المطلوب
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.reddit.com/r/arabic/.rss');
                const data = await response.json();
                
                if(data.status === 'ok') {
                    container.innerHTML = '';
                    data.items.forEach(item => {
                        container.appendChild(renderFeedItem(item));
                    });
                }
            } catch(e) {
                container.innerHTML = '<p style="text-align: center; color: #ef4444;">تعذر تحميل الخلاصات.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchFeeds);
    </script>
</body>
</html>
