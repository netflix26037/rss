<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDDIT بالعربي</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f1419;
            color: #e7e9ea;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #2f3336;
            margin-bottom: 20px;
        }

        header h1 {
            color: #ff4500;
            font-size: 1.8rem;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .feed-item {
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 12px;
            padding: 15px;
        }

        .feed-item a {
            text-decoration: none;
            color: #e7e9ea;
        }

        .feed-item h3 {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 10px;
            color: #f7f9f9;
        }

        .feed-item h3:hover {
            color: #ff4500;
        }

        .feed-item p {
            color: #71767b;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 10px;
            word-break: break-word;
        }

        /* تنسيق الوسائط لتستوعب صور وفيديوهات Reddit */
        .feed-media {
            margin-top: 12px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feed-media img, 
        .feed-media video, 
        .feed-media iframe {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>REDDIT بالعربي</h1>
        </header>

        <main id="feed-container" class="feed-container">
            <!-- يتم تحميل الخلاصات هنا -->
        </main>
    </div>

    <script>
        // دالة فك ترميز HTML المعالج من Reddit
        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        // استخراج وسائط Reddit (صور، فيديوهات، روابط خارجية)
        function extractRedditMedia(item) {
            let mediaHtml = '';

            // 1. فحص الصورة المصغرة أو الروابط المباشرة (thumbnail / enclosure)
            if (item.thumbnail && item.thumbnail.startsWith('http') && !item.thumbnail.includes('self') && !item.thumbnail.includes('default')) {
                return `<img src="${item.thumbnail}" alt="Reddit Media" loading="lazy">`;
            }

            if (item.enclosure && item.enclosure.link) {
                const link = item.enclosure.link;
                if (link.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
                    return `<img src="${link}" alt="Reddit Media" loading="lazy">`;
                }
            }

            // 2. تحليل النص الداخلي المرمّز بـ HTML المرفق من Reddit
            const rawContent = decodeHTML(item.content || item.description || item['content:encoded'] || '');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawContent;

            // البحث عن صور Reddit المباشرة داخل النص
            const img = tempDiv.querySelector('img');
            if (img && img.src) {
                // إصلاح روابط المعاينة من Reddit
                let src = img.src.replace(/&amp;/g, '&');
                return `<img src="${src}" alt="Reddit Media" loading="lazy">`;
            }

            // البحث عن روابط الفيديوهات المضمنة أو المقاطع المتحركة
            const iframe = tempDiv.querySelector('iframe');
            if (iframe && iframe.src) {
                return `<iframe src="${iframe.src}" allowfullscreen></iframe>`;
            }

            const video = tempDiv.querySelector('video');
            if (video) {
                return video.outerHTML;
            }

            return null;
        }

        // دالة بناء وتنسيق منشور Reddit
        function renderFeedItem(item) {
            const itemCard = document.createElement('article');
            itemCard.className = 'feed-item';

            // استخراج وتنسيق النص الصافي
            const rawContent = decodeHTML(item.content || item.description || '');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawContent;

            // إزالة الأوسمة للحصول على النص الصافي فقط
            const cleanText = tempDiv.textContent || tempDiv.innerText || '';
            const mediaContent = extractRedditMedia(item);

            itemCard.innerHTML = `
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">
                    <h3>${item.title}</h3>
                </a>
                ${cleanText.trim() ? `<p>${cleanText.substring(0, 200)}...</p>` : ''}
                ${mediaContent ? `<div class="feed-media">${mediaContent}</div>` : ''}
            `;

            return itemCard;
        }

        // دالة جلب وتعبئة الخلاصات
        async function fetchFeeds() {
            const container = document.getElementById('feed-container');
            
            /* 
               مثال لجلب الخلاصة في حال استخدام API تحويل مثل rss2json:
               
               const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.reddit.com/r/arabic/.rss');
               const data = await response.json();
               
               container.innerHTML = '';
               data.items.forEach(item => {
                   container.appendChild(renderFeedItem(item));
               });
            */
        }

        document.addEventListener('DOMContentLoaded', fetchFeeds);
    </script>
</body>
</html>
