<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDDIT بالعربي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #f5f5f7; padding-bottom: env(safe-area-inset-bottom); }
        
        /* Mobile Header */
        header { background: #1c1c1e; padding: 12px 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #38383a; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; color: #fff; font-weight: 600; }
        
        /* Sources Bar (Horizontal Scroll) */
        .sources-bar { display: flex; overflow-x: auto; background: #1c1c1e; padding: 8px 12px; gap: 8px; border-bottom: 1px solid #38383a; white-space: nowrap; }
        .sources-bar::-webkit-scrollbar { display: none; }
        .source-chip { background: #2c2c2e; color: #fff; padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; border: 1px solid #38383a; }
        .source-chip.active { background: #0a84ff; border-color: #0a84ff; }

        /* Feed Mobile Layout */
        .feed { padding: 10px; }
        .post-card { background: #1c1c1e; border-radius: 12px; margin-bottom: 12px; padding: 14px; border: 1px solid #2c2c2e; }
        .post-source { font-size: 0.75rem; color: #8e8e93; margin-bottom: 4px; font-weight: 500; }
        .post-title { font-size: 1rem; color: #ffffff; text-decoration: none; display: block; margin-bottom: 8px; line-height: 1.35; font-weight: 500; }
        .post-desc { font-size: 0.85rem; color: #8e8e93; margin-bottom: 10px; }
        
        /* Media Styles */
        .post-media { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; margin-top: 8px; background: #111; }
        .post-video { width: 100%; border-radius: 8px; margin-top: 8px; }

        .loading { text-align: center; color: #8e8e93; margin-top: 40px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>REDDIT بالعربي</h1>
    </header>

    <div id="sources-bar" class="sources-bar">
        <div class="source-chip active" onclick="filterSource('all', this)">الكل</div>
    </div>

    <div id="loading" class="loading">جاري تحديث الخلاصات...</div>
    <div id="feed" class="feed"></div>

    <script>
        const WORKER_PROXY = 'https://rss-proxy.red-108.workers.dev/?url=';
        let allArticles = [];

        async function init() {
            try {
                const res = await fetch('feed.json');
                const sources = await res.json();
                
                renderSourcesBar(sources);

                const promises = sources.map(source => fetchFeedData(source));
                const results = await Promise.all(promises);
                
                allArticles = results.flat();
                allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                document.getElementById('loading').style.display = 'none';
                renderArticles(allArticles);

            } catch (err) {
                document.getElementById('loading').innerText = 'تعذر الاتصال بالخلاصات.';
            }
        }

        async function fetchFeedData(source) {
            try {
                let targetUrl = source.url;
                if (targetUrl.includes('reddit.com') && !targetUrl.endsWith('.rss')) {
                    targetUrl = targetUrl.replace(/\/$/, '') + '/.rss';
                }

                const res = await fetch(WORKER_PROXY + encodeURIComponent(targetUrl));
                const text = await res.text();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = Array.from(xml.querySelectorAll('item, entry'));

                return items.map(item => {
                    const contentHtml = item.querySelector('description, content, summary')?.textContent || '';
                    return {
                        id: item.querySelector('guid, id, link')?.textContent || Math.random(),
                        title: item.querySelector('title')?.textContent || '',
                        link: item.querySelector('link')?.textContent || item.querySelector('link')?.getAttribute('href') || '#',
                        pubDate: item.querySelector('pubDate, updated, published')?.textContent || new Date().toISOString(),
                        description: contentHtml.replace(/<[^>]*>?/gm, '').substring(0, 100) + '...',
                        sourceName: source.name,
                        mediaImage: extractImage(item, contentHtml),
                        mediaVideo: extractVideo(contentHtml)
                    };
                });
            } catch (e) {
                return [];
            }
        }

        function extractImage(item, html) {
            const mediaTag = item.getElementsByTagNameNS('*', 'content')[0] || item.querySelector('enclosure');
            if (mediaTag && mediaTag.getAttribute('url')) return mediaTag.getAttribute('url');
            
            const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (match && !match[1].includes('award_images')) return match[1];
            return null;
        }

        function extractVideo(html) {
            const match = html.match(/<video[^>]*>.*?<\/video>|<iframe[^>]*src=["']([^"']+)["'][^>]*>.*?<\/iframe>/i);
            return match ? match[0] : null;
        }

        function renderSourcesBar(sources) {
            const bar = document.getElementById('sources-bar');
            sources.forEach(src => {
                const chip = document.createElement('div');
                chip.className = 'source-chip';
                chip.innerText = src.name;
                chip.onclick = () => {
                    document.querySelectorAll('.source-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    filterSource(src.name);
                };
                bar.appendChild(chip);
            });
        }

        function filterSource(sourceName, el) {
            if(el) {
                document.querySelectorAll('.source-chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            if (sourceName === 'all') {
                renderArticles(allArticles);
            } else {
                const filtered = allArticles.filter(a => a.sourceName === sourceName);
                renderArticles(filtered);
            }
        }

        function renderArticles(articles) {
            const container = document.getElementById('feed');
            if (articles.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#8e8e93; margin-top:20px;">لا توجد مقالات.</p>';
                return;
            }

            container.innerHTML = articles.map(art => `
                <div class="post-card">
                    <div class="post-source">${art.sourceName}</div>
                    <a href="${art.link}" target="_blank" class="post-title">${art.title}</a>
                    <div class="post-desc">${art.description}</div>
                    ${art.mediaImage ? `<img src="${art.mediaImage}" class="post-media" loading="lazy" />` : ''}
                    ${art.mediaVideo ? `<div class="post-video">${art.mediaVideo}</div>` : ''}
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
