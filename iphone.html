<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>REDDIT بالعربي</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { 
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(65px + env(safe-area-inset-bottom));
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            -webkit-font-smoothing: antialiased;
        }
        .ticker-scroll::-webkit-scrollbar { display: none; }
        .ticker-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .bottom-nav-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col select-none">

    <!-- شريط أسعار العملات والأسهم المباشر -->
    <div class="bg-slate-950 text-white text-xs py-2 px-4 border-b border-slate-800 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-2 shrink-0 pl-3 border-l border-slate-800">
            <span class="relative flex h-2.5 w-2.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <span class="font-bold text-gray-400 text-xs">مباشر</span>
        </div>
        
        <div class="ticker-scroll flex items-center gap-4 overflow-x-auto whitespace-nowrap scroll-smooth flex-grow py-0.5 px-3">
            <div id="box-BRENT" class="flex items-center gap-1.5 font-mono px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-xs">
                <span class="font-bold text-amber-500"><i class="fa-solid fa-droplet"></i> BRENT</span>
                <span id="price-BRENT" class="text-gray-200 font-bold">--.--</span>
            </div>
            <div id="box-BTC" class="flex items-center gap-1.5 font-mono px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-xs">
                <span class="font-bold text-cyan-400">BTC</span>
                <span id="price-BTC" class="text-gray-200 font-bold">--.--</span>
            </div>
        </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 sm:px-6 py-3 sticky top-[37px] z-40 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5 sm:gap-3">
                <button onclick="toggleSidebar()" class="text-gray-300 text-xl p-2 hover:bg-gray-700 rounded-lg transition">
                    <i class="fa-solid fa-bars"></i>
                </button>
                
                <!-- النقر ينقل إلى أعلى الصفحة بسلاسة -->
                <div onclick="window.scrollTo({ top: 0, behavior: 'smooth' });" class="flex items-center gap-2.5 sm:gap-3 cursor-pointer group select-none">
                    <div class="bg-[#FF4500] text-white p-2 rounded-xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-brands fa-reddit-alien text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-base sm:text-lg font-bold leading-tight group-hover:text-[#FF4500] transition-colors duration-200">REDDIT بالعربي</h1>
                        <div class="flex items-center gap-2">
                            <span id="digital-clock" class="text-xs font-mono text-gray-400 font-semibold">00:00:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="location.reload()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-rotate"></i> <span class="hidden sm:inline">تحديث الصفحة</span>
                </button>
                <button onclick="openModal()" class="bg-[#FF4500] hover:bg-[#e03d00] text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-md transition">
                    <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">إضافة مصدر</span>
                </button>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية (Sidebar Drawer) -->
    <div id="sidebar-drawer" class="fixed inset-0 bg-black/70 z-50 hidden justify-center items-center md:items-start md:pt-20 transition-opacity">
        <div class="bg-gray-800 rounded-2xl w-full max-w-xl max-h-[80vh] flex flex-col p-4 sm:p-5 overflow-hidden border border-gray-700 shadow-2xl mx-4">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-700">
                <h2 class="text-base font-bold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-bars text-[#FF4500]"></i> المصادر والأقسام (feeds.json)
                </h2>
                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white p-1 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="overflow-y-auto space-y-4 pr-1" id="drawer-content">
                <div id="sources-container" class="space-y-3">
                    <p class="text-xs text-gray-400 text-center py-4">جاري قراءة ملف feeds.json...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- المحتوى الرئيسي للموقع -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-grow w-full">
        <div class="flex justify-between items-center mb-4 sm:mb-5 pb-2 border-b border-gray-800">
            <h2 id="current-feed-title" class="text-sm sm:text-base font-bold text-gray-200 truncate flex items-center gap-2">
                <i class="fa-solid fa-newspaper text-[#FF4500]"></i> المواضيع الحالية (خلال 24 ساعة الأخيرة)
            </h2>
        </div>
        
        <div id="articles-container" class="flex flex-col gap-4 sm:gap-5">
            <div class="text-center py-24 text-gray-500 bg-gray-800/40 rounded-2xl border border-gray-800">
                <i class="fa-brands fa-reddit text-5xl mb-3 text-[#FF4500] animate-pulse"></i>
                <p class="text-sm font-medium">اختر مصدراً أو انتظر تحميل الخلاصة...</p>
            </div>
        </div>
    </main>

    <!-- شريط العدادات والتنقل السفلي (المثبت في الأسفل) -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-800/95 border-t border-gray-700/80 z-40 backdrop-blur-md bottom-nav-safe shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-around py-2 px-2 sm:px-4 text-xs font-bold">
            <button onclick="switchTab('unread')" id="tab-unread" class="flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-xl bg-[#FF4500] text-white transition">
                <i class="fa-solid fa-envelope-open-text"></i>
                <span>غير مقروء</span>
                <span id="count-unread" class="bg-black/30 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>
            <button onclick="switchTab('favorites')" id="tab-favorites" class="flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-xl text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-star text-amber-400"></i>
                <span>المفضلة</span>
                <span id="count-favorites" class="bg-black/30 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>
            <button onclick="switchTab('read')" id="tab-read" class="flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-xl text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-check-double text-blue-400"></i>
                <span>تمت القراءة</span>
                <span id="count-read" class="bg-black/30 px-2 py-0.5 rounded-full text-[10px]">0</span>
            </button>
        </div>
    </div>

    <!-- Modal إضافة مصدر جديد -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-800 text-gray-100 w-full max-w-md rounded-2xl p-5 sm:p-6 border border-gray-700 shadow-2xl">
            <h3 class="text-base font-bold mb-4">إضافة خلاصة RSS جديدة</h3>
            <form onsubmit="addSource(event)">
                <div class="space-y-3 mb-5">
                    <input type="text" id="source-name" placeholder="اسم المصدر" class="w-full px-3.5 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#FF4500]">
                    <input type="url" id="source-url" required placeholder="رابط الـ RSS" class="w-full px-3.5 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#FF4500]">
                    <input type="text" id="source-category" placeholder="المجموعة" class="w-full px-3.5 py-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-[#FF4500]">
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-2.5 rounded-xl text-xs font-semibold transition">إلغاء</button>
                    <button type="submit" class="flex-1 bg-[#FF4500] hover:bg-[#e03d00] text-white py-2.5 rounded-xl text-xs font-semibold transition">إضافة</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let sources = [];
        let allFetchedArticles = [];
        let currentTab = 'unread';

        let readIds = new Set(JSON.parse(localStorage.getItem('app_read_ids') || '[]'));
        let pendingReadIds = new Set(JSON.parse(localStorage.getItem('app_pending_read_ids') || '[]'));
        let favoriteArticles = JSON.parse(localStorage.getItem('app_favorite_articles') || '[]');

        function toggleSidebar() {
            const drawer = document.getElementById('sidebar-drawer');
            drawer.classList.toggle('hidden');
            drawer.classList.toggle('flex');
        }

        function extractMedia(item) {
            let media = { image: null, video: null };
            if (item.enclosure && item.enclosure.link) {
                const type = item.enclosure.type || '';
                if (type.includes('image') || item.enclosure.link.match(/\.(jpg|jpeg|png|gif|webp)$/i)) media.image = item.enclosure.link;
                else if (type.includes('video') || item.enclosure.link.match(/\.(mp4|webm|ogg)$/i)) media.video = item.enclosure.link;
            }
            const htmlString = (item.content || item.description || '');
            const doc = new DOMParser().parseFromString(htmlString, 'text/html');
            if (!media.image) {
                const img = doc.querySelector('img');
                if (img && img.src && !img.src.includes('preview.redd.it/award_images')) media.image = img.src;
            }
            if (!media.video) {
                const video = doc.querySelector('video source, video');
                if (video && video.src) media.video = video.src;
            }
            if (!media.image && item.thumbnail && item.thumbnail.startsWith('http')) media.image = item.thumbnail;
            return media;
        }

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (isNaN(seconds)) return 'تاريخ غير معروف';

            let interval = Math.floor(seconds / 3600);
            if (interval >= 1) return `منذ ${interval} ساعة${interval > 1 && interval < 11 ? 'ات' : ''}`;
            interval = Math.floor(seconds / 60);
            if (interval >= 1) return `منذ ${interval} دقيقة`;
            return `منذ بضع ثوانٍ`;
        }

        async function fetchFeedsJSON() {
            try {
                const response = await fetch('./feeds.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    sources = data;
                    localStorage.setItem('rss_sources_app', JSON.stringify(data));
                    return data;
                }
            } catch (err) {}

            const localData = localStorage.getItem('rss_sources_app');
            if (localData) {
                try { return JSON.parse(localData); } catch(e) {}
            }
            return [];
        }

        async function translateText(text) {
            if (!text || text.trim() === '') return '';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=${encodeURIComponent(text.substring(0, 800))}`);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) { return text; }
        }

        function renderSources() {
            const container = document.getElementById('sources-container');
            container.innerHTML = '';
            if (!sources || sources.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-red-400">لم يتم العثور على مصادر داخل feeds.json</div>`;
                return;
            }

            const grouped = {};
            sources.forEach((s, idx) => {
                const cat = s.category || 'عام';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({ ...s, idx });
            });

            for (const [cat, items] of Object.entries(grouped)) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'space-y-1 bg-gray-900/60 p-3 rounded-xl border border-gray-700/60';
                groupDiv.innerHTML = `
                    <div class="flex items-center justify-between pb-1.5 border-b border-gray-700">
                        <button onclick="loadCategoryFeed('${cat.replace(/'/g, "\\'")}'); toggleSidebar();" class="text-xs font-bold text-[#FF4500] hover:underline flex items-center gap-1.5">
                            <i class="fa-solid fa-folder-open text-amber-500"></i> ${cat}
                        </button>
                    </div>
                    <ul class="space-y-1.5 pt-2"></ul>
                `;
                const ul = groupDiv.querySelector('ul');
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-gray-800/80 hover:bg-gray-700/80 text-xs transition">
                            <button onclick="loadFeed('${item.name.replace(/'/g, "\\'")}', '${item.url}'); toggleSidebar();" class="text-right flex-grow font-medium truncate flex items-center">
                                <i class="fa-solid fa-rss text-[10px] text-gray-400 ml-1.5"></i>${item.name}
                            </button>
                            <button onclick="deleteSource(${item.idx})" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    `;
                    ul.appendChild(li);
                });
                container.appendChild(groupDiv);
            }
        }

        // جلب الـ XML المباشر عبر Cloudflare Worker وتحليله محلياً لضمان السرعة والدعم الكامل
        async function fetchArticlesFromUrl(url, sourceName) {
            try {
                const proxyUrl = `https://rss-proxy.red-108.workers.dev/?url=${encodeURIComponent(url)}`;
                const res = await fetch(proxyUrl);
                const xmlText = await res.text();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                let items = Array.from(xmlDoc.querySelectorAll("item"));
                if (items.length === 0) {
                    items = Array.from(xmlDoc.querySelectorAll("entry")); // لدعم خلاصة Atom/Reddit
                }
                
                const now = new Date();
                const fetchedList = [];

                for (let item of items) {
                    const title = item.querySelector("title")?.textContent || "";
                    
                    let link = "";
                    const linkEl = item.querySelector("link");
                    if (linkEl) {
                        link = linkEl.getAttribute("href") || linkEl.textContent || "";
                    }

                    const pubDateStr = item.querySelector("pubDate, published, updated")?.textContent || "";
                    const pubDate = pubDateStr ? new Date(pubDateStr) : new Date();

                    const diffHours = (now - pubDate) / (1000 * 60 * 60);

                    // تصفية أحدث 24 ساعة فقط
                    if (diffHours <= 24) {
                        const description = item.querySelector("description, content, summary")?.textContent || "";
                        const guid = item.querySelector("guid, id")?.textContent || link;

                        let enclosureObj = null;
                        const enclosure = item.querySelector("enclosure");
                        if (enclosure) {
                            enclosureObj = {
                                link: enclosure.getAttribute("url"),
                                type: enclosure.getAttribute("type")
                            };
                        }

                        const rawItem = {
                            guid: guid,
                            title: title,
                            link: link,
                            pubDate: pubDateStr,
                            description: description,
                            enclosure: enclosureObj,
                            thumbnail: item.querySelector("thumbnail")?.getAttribute("url") || null,
                            content: description
                        };

                        fetchedList.push({
                            id: guid || link,
                            title: title,
                            link: link,
                            pubDate: pubDateStr,
                            description: description,
                            sourceName: sourceName,
                            media: extractMedia(rawItem)
                        });
                    }
                }
                return fetchedList;
            } catch (e) {
                console.error("Error fetching feed:", url, e);
            }
            return [];
        }

        async function loadFeed(title, url) {
            document.getElementById('current-feed-title').innerText = title;
            const container = document.getElementById('articles-container');
            container.innerHTML = `<div class="text-center py-20 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-[#FF4500]"></i><p class="text-xs">جاري جلب المنشورات لـ 24 ساعة الماضية...</p></div>`;

            allFetchedArticles = await fetchArticlesFromUrl(url, title);
            renderCurrentTab();
        }

        async function loadCategoryFeed(category) {
            document.getElementById('current-feed-title').innerText = category;
            const container = document.getElementById('articles-container');
            container.innerHTML = `<div class="text-center py-20 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-[#FF4500]"></i><p class="text-xs">جاري تحميل خلاصة المجموعة...</p></div>`;

            const catSources = sources.filter(s => (s.category || 'عام') === category);
            
            // جلب متوازي لكافة مصادر المجموعة
            const promises = catSources.map(source => fetchArticlesFromUrl(source.url, source.name));
            const results = await Promise.all(promises);
            
            allFetchedArticles = results.flat();
            renderCurrentTab();
        }

        async function loadAllSources() {
            if (!sources || sources.length === 0) return;
            const container = document.getElementById('articles-container');
            container.innerHTML = `<div class="text-center py-20 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-[#FF4500]"></i><p class="text-xs">جاري تحميل جميع المصادر (24 ساعة الأخيرة)...</p></div>`;

            // جلب متوازي لكافة المصادر دفعة واحدة لسرعة قصوى
            const promises = sources.map(source => fetchArticlesFromUrl(source.url, source.name));
            const results = await Promise.all(promises);

            allFetchedArticles = results.flat();
            renderCurrentTab();
        }

        function commitPendingReads() {
            if (pendingReadIds.size > 0) {
                pendingReadIds.forEach(id => readIds.add(id));
                localStorage.setItem('app_read_ids', JSON.stringify([...readIds]));
                localStorage.removeItem('app_pending_read_ids');
                pendingReadIds.clear();
            }
        }

        function markAsHoveredRead(id) {
            if (!readIds.has(id)) {
                pendingReadIds.add(id);
                localStorage.setItem('app_pending_read_ids', JSON.stringify([...pendingReadIds]));
                updateCounts();
            }
        }

        function toggleFavorite(article) {
            const index = favoriteArticles.findIndex(a => a.id === article.id);
            if (index > -1) {
                favoriteArticles.splice(index, 1);
            } else {
                favoriteArticles.push(article);
            }
            localStorage.setItem('app_favorite_articles', JSON.stringify(favoriteArticles));
            updateCounts();
            renderCurrentTab();
        }

        function updateCounts() {
            const unreadList = allFetchedArticles.filter(a => !readIds.has(a.id) && !pendingReadIds.has(a.id));
            const readList = allFetchedArticles.filter(a => readIds.has(a.id) || pendingReadIds.has(a.id));

            document.getElementById('count-unread').innerText = unreadList.length;
            document.getElementById('count-favorites').innerText = favoriteArticles.length;
            document.getElementById('count-read').innerText = readList.length;
        }

        function switchTab(tab) {
            currentTab = tab;
            ['unread', 'favorites', 'read'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-xl bg-[#FF4500] text-white transition";
                } else {
                    btn.className = "flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-xl text-gray-400 hover:text-white transition";
                }
            });
            renderCurrentTab();
        }

        async function renderCurrentTab() {
            updateCounts();
            let displayList = [];

            if (currentTab === 'unread') {
                displayList = allFetchedArticles.filter(a => !readIds.has(a.id) && !pendingReadIds.has(a.id));
            } else if (currentTab === 'read') {
                displayList = allFetchedArticles.filter(a => readIds.has(a.id) || pendingReadIds.has(a.id));
            } else if (currentTab === 'favorites') {
                displayList = favoriteArticles;
            }

            renderArticlesContainer(displayList);
        }

        async function renderArticlesContainer(articles) {
            const container = document.getElementById('articles-container');
            container.innerHTML = '';

            if (!articles || articles.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-500 bg-gray-800/20 rounded-2xl border border-gray-800">لا توجد مواضيع في هذا القسم حالياً.</div>`;
                return;
            }

            let index = 0;
            for (let item of articles) {
                index++;
                const isNightTheme = index % 2 !== 0;
                const isFav = favoriteArticles.some(a => a.id === item.id);
                
                const cleanDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '').trim() : '';
                const transTitle = await translateText(item.title);
                const transDesc = await translateText(cleanDesc);

                const pubDateObj = new Date(item.pubDate);
                const formattedDate = isNaN(pubDateObj) ? '' : pubDateObj.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const agoText = timeAgo(item.pubDate);

                let mediaHTML = '';
                if (item.media) {
                    if (item.media.video) {
                        mediaHTML = `
                            <div class="my-3 overflow-hidden rounded-xl bg-black border border-gray-700/50">
                                <video controls playsinline webkit-playsinline class="w-full max-h-96 object-cover" preload="metadata">
                                    <source src="${item.media.video}">
                                </video>
                            </div>`;
                    } else if (item.media.image) {
                        mediaHTML = `
                            <div class="my-3 overflow-hidden rounded-xl bg-black/20 border border-gray-700/30">
                                <img src="${item.media.image}" alt="صورة المنشور" class="w-full max-h-96 object-cover hover:scale-102 transition duration-300" loading="lazy" onerror="this.style.display='none'">
                            </div>`;
                    }
                }

                const themeClasses = isNightTheme 
                    ? 'bg-slate-900 border-slate-800 text-gray-100 shadow-xl' 
                    : 'bg-amber-50/95 border-amber-200 text-gray-900 shadow-md';
                const subTextClass = isNightTheme ? 'text-gray-400' : 'text-gray-600';
                const bodyTextClass = isNightTheme ? 'text-gray-300' : 'text-gray-800';

                const card = document.createElement('article');
                card.className = `w-full border p-4 sm:p-5 rounded-2xl flex flex-col justify-between transition duration-200 relative ${themeClasses}`;
                
                card.onmouseenter = () => markAsHoveredRead(item.id);
                card.ontouchstart = () => markAsHoveredRead(item.id);

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-md text-[11px] font-bold bg-[#FF4500]/10 text-[#FF4500] border border-[#FF4500]/20">
                                    ${item.sourceName || 'Reddit'}
                                </span>
                                <span class="text-[11px] ${subTextClass} flex items-center gap-1">
                                    <i class="fa-regular fa-clock"></i> ${formattedDate} (${agoText})
                                </span>
                            </div>
                            <button onclick='toggleFavorite(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="text-lg p-1 hover:scale-110 transition">
                                <i class="${isFav ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star ' + subTextClass}"></i>
                            </button>
                        </div>

                        <h3 class="font-bold text-sm sm:text-base leading-snug mb-2">${transTitle}</h3>
                        ${mediaHTML}
                        <p class="${bodyTextClass} text-xs line-clamp-4 mb-4 leading-relaxed">${transDesc}</p>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t ${isNightTheme ? 'border-gray-800' : 'border-amber-200/80'} mt-2">
                        <a href="${item.link}" target="_blank" class="bg-[#FF4500] hover:bg-[#e03d00] text-white px-4 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition shadow">
                            زيارة المصدر <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function addSource(e) {
            e.preventDefault();
            const name = document.getElementById('source-name').value.trim() || 'مصدر جديد';
            const url = document.getElementById('source-url').value.trim();
            const category = document.getElementById('source-category').value.trim() || 'عام';

            sources.push({ name, url, category });
            localStorage.setItem('rss_sources_app', JSON.stringify(sources));
            renderSources();
            closeModal();
            e.target.reset();
        }

        function deleteSource(idx) {
            sources.splice(idx, 1);
            localStorage.setItem('rss_sources_app', JSON.stringify(sources));
            renderSources();
        }

        function openModal() { document.getElementById('add-modal').classList.remove('hidden'); document.getElementById('add-modal').classList.add('flex'); }
        function closeModal() { document.getElementById('add-modal').classList.add('hidden'); document.getElementById('add-modal').classList.remove('flex'); }

        function startClock() {
            setInterval(() => {
                const el = document.getElementById('digital-clock');
                if (el) el.innerText = new Date().toTimeString().split(' ')[0];
            }, 1000);
        }

        window.onload = async function() {
            commitPendingReads();
            startClock();
            sources = await fetchFeedsJSON();
            renderSources();
            if (sources.length > 0) {
                await loadAllSources();
            }
        };
    </script>
</body>
</html>
