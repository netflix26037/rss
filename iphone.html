<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>REDDIT بالعربي</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f1419;
            color: #e7e9ea;
            padding: env(safe-area-inset-top, 15px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 15px) env(safe-area-inset-left, 12px);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #2f3336;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background-color: rgba(15, 20, 25, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }

        header h1 {
            color: #ff4500;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feed-item {
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 14px;
            padding: 14px;
            overflow: hidden;
        }

        .feed-item a {
            text-decoration: none;
            color: #e7e9ea;
        }

        .feed-item h3 {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #f7f9f9;
        }

        .feed-item p {
            color: #71767b;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .feed-media {
            margin-top: 10px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feed-media img, 
        .feed-media video, 
        .feed-media iframe {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 10px;
            border: none;
            display: block;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 30px;
            color: #71767b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>REDDIT بالعربي</h1>
        </header>

        <main id="feed-container" class="feed-container">
            <div class="loading">جاري تحميل الخلاصات...</div>
        </main>
    </div>

    <script>
        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        function extractRedditMedia(item) {
            const rawContent = decodeHTML(item.content || item.description || item['content:encoded'] || '');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawContent;

            // 1. استخراج الصور
            const img = tempDiv.querySelector('img');
            if (img && img.src) {
                let src = img.src.replace(/&amp;/g, '&');
                if (!src.includes('award_images') && !src.includes('s.redditmedia.com')) {
                    return `<img src="${src}" alt="Reddit Media" loading="lazy">`;
                }
            }

            // 2. المرفقات المباشرة
            if (item.enclosure && item.enclosure.link) {
                const link = item.enclosure.link;
                if (link.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
                    return `<img src="${link}" alt="Reddit Media" loading="lazy">`;
                }
                if (link.match(/\.(mp4|mov)/i)) {
                    return `<video controls playsinline webkit-playsinline preload="metadata" src="${link}"></video>`;
                }
            }

            if (item.thumbnail && item.thumbnail.startsWith('http') && !item.thumbnail.includes('self') && !item.thumbnail.includes('default')) {
                return `<img src="${item.thumbnail}" alt="Reddit Media" loading="lazy">`;
            }

            // 3. الفيديوهات وIframes
            const iframe = tempDiv.querySelector('iframe');
            if (iframe && iframe.src) {
                return `<iframe src="${iframe.src}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
            }

            const video = tempDiv.querySelector('video');
            if (video) {
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                return video.outerHTML;
            }

            return null;
        }

        function renderFeedItem(item) {
            const itemCard = document.createElement('article');
            itemCard.className = 'feed-item';

            const rawContent = decodeHTML(item.content || item.description || '');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawContent;

            const cleanText = tempDiv.textContent || tempDiv.innerText || '';
            const mediaContent = extractRedditMedia(item);

            itemCard.innerHTML = `
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">
                    <h3>${item.title}</h3>
                </a>
                ${cleanText.trim() ? `<p>${cleanText.substring(0, 180)}...</p>` : ''}
                ${mediaContent ? `<div class="feed-media">${mediaContent}</div>` : ''}
            `;

            return itemCard;
        }

        async function fetchFeeds() {
            const container = document.getElementById('feed-container');
            const targetRss = 'https://www.reddit.com/r/arabic/.rss';
            
            try {
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetRss)}`);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    container.innerHTML = '';
                    data.items.forEach(item => {
                        container.appendChild(renderFeedItem(item));
                    });
                } else {
                    container.innerHTML = '<div class="error-msg">تعذر جلب الخلاصات حالياً.</div>';
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="error-msg">حدث خطأ أثناء الاتصال بالشبكة.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchFeeds);
    </script>
</body>
</html>
