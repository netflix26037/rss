<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعداد المزامنة — مرة واحدة فقط</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #030303;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  button {
    background: #FF4500;
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #result {
    margin-top: 24px;
    padding: 16px;
    background: #1A1A1B;
    border-radius: 12px;
    max-width: 90%;
    word-break: break-all;
    font-family: monospace;
    font-size: 14px;
    display: none;
  }
  .copy-btn {
    background: #343536;
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h2>🔧 إعداد المزامنة بين الأجهزة</h2>
  <p>اضغط الزر مرة واحدة فقط لإنشاء مساحة تخزين مجانية للمزامنة.</p>
  <button onclick="createBucket()">إنشاء مساحة المزامنة</button>
  <div id="result"></div>

<script>
async function createBucket() {
  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  resultDiv.innerText = 'جاري الإنشاء...';
  try {
    const res = await fetch('https://kvdb.io/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'email=reddit-arabic-sync@example.com'
    });
    const bucketId = (await res.text()).trim();
    if (bucketId && bucketId.length > 5) {
      resultDiv.innerHTML = `
        ✅ تم الإنشاء بنجاح!<br><br>
        <strong>معرّف المساحة (انسخه وأرسله لي):</strong><br>
        <span id="bucketIdText">${bucketId}</span><br>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${bucketId}'); this.innerText='تم النسخ ✓'">نسخ</button>
      `;
    } else {
      resultDiv.innerText = 'حدث خطأ غير متوقع، حاول مرة أخرى: ' + bucketId;
    }
  } catch (e) {
    resultDiv.innerText = 'فشل الإنشاء: ' + e.message;
  }
}
</script>
</body>
</html>
